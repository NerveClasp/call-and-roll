<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <title>Raspberry</title>
  <desc>A stylized SVG of a raspberry</desc>
  
  <!-- Leaf -->
  <path d="M40,110 C25,105 15,95 20,80 C22,75 30,70 40,75 L40,110 Z" fill="#5C913B" />
  <path d="M60,110 C75,105 85,95 80,80 C78,75 70,70 60,75 L60,110 Z" fill="#5C913B" />
  
  <!-- Stem -->
  <rect x="48" y="70" width="4" height="40" fill="#7A5C2D" />
  
  <!-- Berry Body -->
  <circle cx="50" cy="60" r="40" fill="#D13F5D" />
  
  <!-- Drupelets (the little bumps) -->
  <circle cx="50" cy="35" r="7" fill="#E2869E" />
  <circle cx="35" cy="40" r="7" fill="#E2869E" />
  <circle cx="65" cy="40" r="7" fill="#E2869E" />
  <circle cx="30" cy="55" r="7" fill="#E2869E" />
  <circle cx="50" cy="60" r="7" fill="#E2869E" />
  <circle cx="70" cy="55" r="7" fill="#E2869E" />
  <circle cx="40" cy="70" r="7" fill="#E2869E" />
  <circle cx="60" cy="70" r="7" fill="#E2869E" />
  <circle cx="50" cy="80" r="7" fill="#E2869E" />
  
  <!-- Highlight on a few drupelets for a shiny effect -->
  <circle cx="48" cy="33" r="2" fill="white" opacity="0.8" />
  <circle cx="33" cy="38" r="2" fill="white" opacity="0.8" />
  <circle cx="63" cy="38" r="2" fill="white" opacity="0.8" />
</svg>
