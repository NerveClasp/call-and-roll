<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#87CEEB" />
  
  <!-- Ground -->
  <path d="M0 70 L100 70 L100 100 L0 100 Z" fill="#8B4513" />
  
  <!-- Water Stream -->
  <path d="M0 70 L20 70 L25 100 L0 100 Z" fill="#1E90FF" />
  <path d="M20 70 C30 65, 40 65, 50 70 L50 100 L25 100 Z" fill="#1E90FF" />
  <path d="M50 70 C60 65, 70 65, 80 70 L80 100 L50 100 Z" fill="#1E90FF" />
  <path d="M80 70 L100 70 L100 100 L80 100 Z" fill="#1E90FF" />
  
  <!-- Mill House -->
  <path d="M30 40 L70 40 L70 70 L30 70 Z" fill="#CD853F" />
  <path d="M30 40 L50 20 L70 40 Z" fill="#A52A2A" />
  
  <!-- Door -->
  <rect x="45" y="50" width="10" height="20" fill="#8B4513" />
  
  <!-- Window -->
  <rect x="55" y="45" width="10" height="10" fill="#87CEEB" stroke="#8B4513" />
  <line x1="60" y1="45" x2="60" y1="55" stroke="#8B4513" />
  <line x1="55" y1="50" x2="65" y1="50" stroke="#8B4513" />
  
  <!-- Water Wheel -->
  <circle cx="20" cy="70" r="15" fill="#8B4513" stroke="#A52A2A" stroke-width="2" />
  <circle cx="20" cy="70" r="3" fill="#DAA520" />
  
  <!-- Wheel Spokes -->
  <line x1="20" y1="55" x2="20" y1="85" stroke="#A52A2A" stroke-width="2" />
  <line x1="8" y1="63" x2="32" y1="77" stroke="#A52A2A" stroke-width="2" />
  <line x1="8" y1="77" x2="32" y1="63" stroke="#A52A2A" stroke-width="2" />
  
  <!-- Paddles in Water -->
  <path d="M5 85 L8 75 L12 80 L10 90 Z" fill="#A52A2A" />
  <path d="M15 90 L18 80 L22 85 L20 95 Z" fill="#A52A2A" />
  
  <!-- Mill Blades -->
  <path d="M50 20 L50 5" stroke="#A52A2A" stroke-width="3" stroke-linecap="round" />
  <path d="M50 20 L65 15" stroke="#A52A2A" stroke-width="3" stroke-linecap="round" />
  <path d="M50 20 L60 32" stroke="#A52A2A" stroke-width="3" stroke-linecap="round" />
  <path d="M50 20 L35 15" stroke="#A52A2A" stroke-width="3" stroke-linecap="round" />
  <path d="M50 20 L40 32" stroke="#A52A2A" stroke-width="3" stroke-linecap="round" />
</svg>
